# Publishes the plugin to the JetBrains Marketplace once a release draft prepared by the
# `Release` workflow is approved (published) on the GitHub Releases page.
name: Publish Plugin
on:
  release:
    types: [ prereleased, released ]

permissions:
  contents: read

jobs:

  # Prepare and publish the plugin to JetBrains Marketplace repository
  publish:
    name: Publish Plugin
    runs-on: ubuntu-latest
    # TODO: add `url: https://plugins.jetbrains.com/plugin/<MARKETPLACE_ID>` once the plugin is listed
    environment:
      name: jetbrains-marketplace
    permissions:
      contents: write
    steps:

      # Free GitHub Actions Environment Disk Space
      - name: Maximize Build Space
        uses: jlumbroso/free-disk-space@v2.0.0
        with:
          tool-cache: false
          large-packages: false

      # Check out the tag the release was published from
      - name: Fetch Sources
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name }}

      # Set up the Java environment for the next steps
      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: zulu
          java-version: 21

      # Setup Gradle
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6.4.0
        with:
          cache-read-only: true

      # Publish the plugin to JetBrains Marketplace
      - name: Publish Plugin
        env:
          PUBLISH_TOKEN: ${{ secrets.PUBLISH_TOKEN }}
          CERTIFICATE_CHAIN: ${{ secrets.CERTIFICATE_CHAIN }}
          PRIVATE_KEY: ${{ secrets.PRIVATE_KEY }}
          PRIVATE_KEY_PASSWORD: ${{ secrets.PRIVATE_KEY_PASSWORD }}
        run: ./gradlew publishPlugin

      # Upload the signed distribution as a release asset
      - name: Upload Release Asset
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ github.event.release.tag_name }}" ./build/distributions/* --clobber
