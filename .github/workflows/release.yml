# Fires automatically whenever a push to main bumps the `version` in gradle.properties:
#
#   read version from gradle.properties -> promote CHANGELOG.md's [Unreleased] section
#   -> commit it on main -> open a DRAFT GitHub release pinned to that commit
#   -> open a PR that syncs the promotion back onto dev
#
name: Release

on:
  push:
    branches: [ main ]
    paths:
      - 'gradle.properties'
  # Allows re-running the promotion by hand if a draft was discarded.
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:

  release:
    name: Draft release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:

      # Check out the full history: the version gate reads the existing tags
      - name: Fetch Sources
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.RELEASE_TOKEN || secrets.GITHUB_TOKEN }}

      # Read the version this run is about to release
      - name: Read the version from gradle.properties
        id: version
        run: |
          set -euo pipefail
          VERSION="$(sed -n 's/^[[:space:]]*version[[:space:]]*=[[:space:]]*\(.*\)[[:space:]]*$/\1/p' gradle.properties | head -n 1)"
          case "$VERSION" in
            [0-9]*) ;;
            *) echo "::error::Version '$VERSION' in gradle.properties must start with a digit."; exit 1 ;;
          esac
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      # A push that didn't touch the version, or a version that already shipped, is a no-op
      - name: Skip if this version is already released
        id: gate
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN || secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          if git rev-parse -q --verify "refs/tags/${VERSION}" >/dev/null || gh release view "$VERSION" >/dev/null 2>&1; then
            echo "::notice::${VERSION} is already tagged or has a release - this push didn't bump the version (or it shipped already). Nothing to do."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      # Set up the Java environment for the next steps
      - name: Setup Java
        if: steps.gate.outputs.skip != 'true'
        uses: actions/setup-java@v6
        with:
          distribution: zulu
          java-version: 21

      # Setup Gradle
      - name: Setup Gradle
        if: steps.gate.outputs.skip != 'true'
        uses: gradle/actions/setup-gradle@v6.4.0
        with:
          cache-read-only: true

      # The notes are read before patching, while they still live under [Unreleased]
      - name: Require notes under [Unreleased]
        if: steps.gate.outputs.skip != 'true'
        run: |
          set -euo pipefail
          RELEASE_NOTE="./build/tmp/release_note.txt"
          mkdir -p "$(dirname "$RELEASE_NOTE")"
          ./gradlew getChangelog --unreleased --no-header --no-summary --quiet --console=plain --output-file="$RELEASE_NOTE"
          if [ ! -s "$RELEASE_NOTE" ] || ! grep -q '[^[:space:]]' "$RELEASE_NOTE"; then
            echo "::error::gradle.properties was bumped to ${{ steps.version.outputs.version }}, but CHANGELOG.md has no content under '## [Unreleased]'. Add the release notes, then push a follow-up commit to main."
            exit 1
          fi
          echo "Notes found under [Unreleased]:"
          cat "$RELEASE_NOTE"

      # Move [Unreleased] into a dated [VERSION] section and open a fresh [Unreleased]
      - name: Patch Changelog
        if: steps.gate.outputs.skip != 'true'
        run: ./gradlew patchChangelog

      - name: Commit the promoted changelog
        if: steps.gate.outputs.skip != 'true'
        id: commit
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Only CHANGELOG.md: gradle.properties is already correct from the merge that
          # triggered this run, and this push must not touch it, or the path filter
          # above would re-trigger this workflow on the commit below.
          git add CHANGELOG.md
          if git diff --cached --quiet; then
            echo "::notice::CHANGELOG.md is already promoted to ${VERSION}; drafting the release off the current main."
          else
            git commit -m "docs(changelog): promote to ${VERSION}"
            git push origin HEAD:main
          fi
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      # A draft is not publicly visible and needs manual acceptance; publishing it
      # creates the tag on the pinned commit and fires the Publish Plugin workflow
      - name: Create Release Draft
        if: steps.gate.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN || secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          gh release create "$VERSION" \
            --draft \
            --title "$VERSION" \
            --notes-file ./build/tmp/release_note.txt \
            --target "${{ steps.commit.outputs.sha }}"
          {
            echo "### Drafted \`${VERSION}\`"
            echo ""
            echo "Publish the draft to tag it and ship the plugin to the JetBrains Marketplace."
            echo ""
            gh release view "$VERSION" --json url --jq .url
          } >> "$GITHUB_STEP_SUMMARY"

      # Carry the version bump and the promoted changelog back to dev, so dev
      # picks up a fresh [Unreleased] section instead of re-releasing these notes
      - name: Sync the release commit back to dev
        if: steps.gate.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN || secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          git fetch origin dev:refs/remotes/origin/dev
          BRANCH="sync-main-${VERSION}"
          git checkout -b "$BRANCH" origin/dev
          git merge --no-edit origin/main

          if [ "$(git rev-parse HEAD)" = "$(git rev-parse origin/dev)" ]; then
            echo "::notice::dev is already up to date with main; nothing to sync."
            exit 0
          fi

          git push --set-upstream origin "$BRANCH"

          gh label create "release changelog" \
            --description "Pull requests with a release changelog update" \
            --force \
            || true

          gh pr create \
            --title "Sync \`${VERSION}\` back to dev" \
            --body "Merges the \`${VERSION}\` version bump and changelog promotion from \`main\` back into \`dev\`, so \`dev\` picks up a fresh \`[Unreleased]\` section." \
            --label "release changelog" \
            --base dev \
            --head "$BRANCH"
