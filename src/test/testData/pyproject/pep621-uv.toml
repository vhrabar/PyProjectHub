[project]
name = "acme-api"
version = "1.4.0"
description = "HTTP API for Acme"
requires-python = ">=3.11"
authors = [{ name = "Ada", email = "ada@example.com" }, { name = "Grace" }]
license = "MIT"
keywords = ["api", "http"]
classifiers = ["Programming Language :: Python :: 3"]
dependencies = ["fastapi>=0.110", "pydantic[email]>=2 ; python_version >= '3.11'"]

[project.optional-dependencies]
docs = ["mkdocs"]

[dependency-groups]
dev = ["pytest>=8", { include-group = "lint" }]
lint = ["ruff"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
dev-dependencies = []
